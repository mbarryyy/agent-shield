# Agent Shield — local infra for integration (cicd.md §3 / Makefile `integration`).
# Stock images only: no app Dockerfiles built here (cicd.md does not reference them;
# the Next.js console ships its own console/Dockerfile). Volumes are named to match
# the .gitignore host-bind exclusions (postgres_data/redis_data/minio_data) so a
# stray bind never gets tracked.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shield
      POSTGRES_PASSWORD: shield
      POSTGRES_DB: shield
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shield -d shield"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: shield
      MINIO_ROOT_PASSWORD: shieldsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  chromadb:
    image: chromadb/chroma:0.5.23
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/localhost/8000"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Mailhog — SMTP catch-all + HTTP/JSON API on :8025 for enterprise-auth tests
  # and the demo email surface (ADR-0013 §12). NOT brought up by the default
  # `make integration` / compose-smoke job; only by `make integration-auth` and
  # the `auth-integration` CI job under SHIELD_AUTH_MODE=enterprise. Data is
  # ephemeral by design (catch-all mailbox); no named volume required.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI + /api/v2/messages
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8025/api/v2/messages || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  redis_data:
  minio_data:
  chroma_data:
