[project]
name = "shield-eval"
version = "0.1.0"
description = "Agent Shield A/B eval: the custom python -m shield_eval.run_ab runner over AgentDojo banking"
requires-python = ">=3.11"
dependencies = [
    "shield-sdk",
    "click>=8.1.7",
    "rich>=13.7.1",
    # W1 (eval-builder, §5b-pinned): agentdojo @ HEAD 18b501a via [tool.uv.sources].
]

[tool.uv.sources]
shield-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shield_eval"]
