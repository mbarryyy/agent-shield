[project]
name = "shield-sdk"
version = "0.1.0"
description = "Agent Shield Layer-1 Free SDK: crypto, the frozen §4 schema (source of truth), AgentDojo elements"
requires-python = ">=3.11"
dependencies = [
    "pydantic[email]>=2.7.1",
    "cryptography>=43.0",
    "httpx>=0.27",
    # agentdojo: pinned at W1 to HEAD 18b501a via [tool.uv.sources] (sdk-builder + eval-builder).
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shield_sdk"]
