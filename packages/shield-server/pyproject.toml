[project]
name = "shield-server"
version = "0.1.0"
description = "Agent Shield FastAPI server: 12-step ingest, verify, Merkle, audit, /v1/governance/decide + Redis Streams"
requires-python = ">=3.11"
dependencies = [
    "shield-sdk",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "minio>=7.2",
    "redis>=5.0",
    "apscheduler>=3.10",
    "reportlab>=4.1",
    "pydantic[email]>=2.7.1",
]

[tool.uv.sources]
shield-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shield_server"]
