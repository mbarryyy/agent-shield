[project]
name = "shield-server"
version = "0.1.0"
description = "Agent Shield FastAPI server: 12-step ingest, verify, Merkle, audit, /v1/governance/decide + Redis Streams"
requires-python = ">=3.11"
dependencies = [
    "shield-sdk",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "minio>=7.2",
    "redis>=5.0",
    "apscheduler>=3.10",
    "reportlab>=4.1",
    "pydantic[email]>=2.7.1",
    # ── Enterprise Auth v1 (ADR-0013) ──────────────────────────────────────
    "argon2-cffi>=23.1.0,<24",
    "pyotp>=2.9.0,<3",
    "slowapi>=0.1.9,<0.2",
    "aiosmtplib>=3.0.1,<4",
    "cryptography>=43.0.0,<44",
]

[tool.uv.sources]
shield-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shield_server"]
