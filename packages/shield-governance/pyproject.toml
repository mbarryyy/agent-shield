[project]
name = "shield-governance"
version = "0.1.0"
description = "Agent Shield Layer-2: deterministic Defender sync gate + async router-backed Channel-2 handler (Evaluator create_agent LLM agent per M2 Phase B; Supervisor/Auditor single-prompt scaffold) + ShieldModelRouter (zero-egress local-serving moat)"
requires-python = ">=3.11"
dependencies = [
    "shield-sdk",
    "networkx>=3.2",
    "pyyaml>=6.0.1",
    # W2 ACTIVATED — §5b-verified first-hand against Related_Work clones
    # 2026-05-19 (cited inline in the modules that use them):
    "langgraph>=1.2",      # langgraph/libs/langgraph/pyproject.toml version=1.2.0; MIT LICENSE:1
    # M2 / ADR-0009 — model_factory returns BaseChatModel so create_agent
    # accepts it directly. ChatAnthropic for the cloud SKU, ChatOpenAI for
    # the OpenAI-compatible local SKU (vLLM via base_url; moat #7 intact).
    "langchain>=0.3",
    "langchain-anthropic>=0.2",
    "langchain-openai>=0.2",
    "invariant-ai==0.3.5", # invariant/pyproject.toml name="invariant-ai" version=0.3.5; Apache LICENSE:1 — LocalPolicy ONLY
    "redis>=5.0",          # Channel-2 Redis Streams consumer (XREADGROUP/XACK)
    # W3 (deferred): langgraph-checkpoint-postgres (HITL interrupt + time-travel
    # rollback), chromadb>=0.5 (Apache-2.0; ANONYMIZED_TELEMETRY=False air-gap).
]

[project.optional-dependencies]
# LlamaFirewall (Meta PurpleLlama framework MIT — PurpleLlama/LlamaFirewall/
# LICENSE:1) pulls torch/transformers (PromptGuard2 86M). Kept an EXTRA so the
# default CI env stays lean and the scanner stays ScannerType-pluggable per the
# air-gap design (local_deployment_moat §3.3/§5). The real scanner adapter
# lazy-imports it only when the live scanner path is enabled; unit tests inject
# a fake scanner.
scanners = ["llamafirewall"]

[tool.uv.sources]
shield-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shield_governance"]
