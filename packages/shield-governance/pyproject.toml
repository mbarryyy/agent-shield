[project]
name = "shield-governance"
version = "0.1.0"
description = "Agent Shield Layer-2: LangGraph 4-guardian graph + ShieldModelRouter (zero-egress local-serving moat)"
requires-python = ">=3.11"
dependencies = [
    "shield-sdk",
    "networkx>=3.2",
    "pyyaml>=6.0.1",
    # W1 (governance-builder, §5b-pinned): langgraph>=0.2, langgraph-checkpoint-postgres>=2.0,
    # chromadb>=0.5, llamafirewall (Meta PurpleLlama, MIT), invariant-ai==<exact-pin> (LocalPolicy only).
]

[tool.uv.sources]
shield-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shield_governance"]
