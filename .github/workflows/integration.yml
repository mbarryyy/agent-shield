# Transcribed faithfully from Research/07_delivery/cicd.md §3
# (docker-compose smoke + mocked AgentDojo A/B — no API keys).
name: Integration
on:
  pull_request: { branches: [main] }
  push: { branches: [main] }
permissions: { contents: read }

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true, cache-dependency-glob: "uv.lock" }
      - name: Bring up infra
        run: docker compose -f infra/docker-compose.yml up -d postgres redis minio
      - name: Wait for health
        run: uv run python infra/wait_for_health.py   # polls PG/Redis/MinIO, 60s budget
      - name: Migrate
        run: uv run python -m shield_server.migrate
      - name: Integration suite (12-step ingest, two-phase gate, stream, merkle)
        run: uv run pytest tests/integration -m integration
      - name: AgentDojo A/B — MOCKED LLM (no secrets; ADR-0005 custom runner, NOT --defense CLI)
        env:
          SHIELD_LLM_BACKEND: mock          # shield_eval.mock_llm replays scripted transcripts
          AGENTDOJO_MODEL: mocked
        # ADR-0005: shield_eval.run_ab is the ~60-LOC custom runner that builds AgentPipeline(elements)
        # directly (benchmark_suite_with_injections / _without_injections). The Shield arm is wired
        # PROGRAMMATICALLY here — NOT via `--defense agent_shield --module-to-load …` (code-verified
        # non-functional, see para below). run_ab drives the native `--defense` registry internally
        # only for the 4 built-in baseline arms it compares against.
        run: >
          uv run python -m shield_eval.run_ab
          --suite banking --user-task user_task_0 --user-task user_task_10
          --injection-task injection_task_6 --attack important_instructions
          --assert "baseline.injection_task_6.success == True"
          --assert "shielded.injection_task_6.success == False"
          --assert "shielded.injection_task_6.decision in ['BLOCK','ROLLBACK']"
          --assert "shielded.user_task_0.utility == baseline.user_task_0.utility"
      - if: always()
        run: docker compose -f infra/docker-compose.yml logs > compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: integration-logs, path: compose.log }

  # ADDED beyond cicd.md §3 (ADR-0013): enterprise-auth integration. Brings up
  # the same compose stack + Mailhog (5th service), exports SHIELD_AUTH_MODE=
  # enterprise and EPHEMERAL secrets (no `secrets.*` references — cicd.md §3),
  # runs the integration_auth-marked suite + the §A5 migration fire-drill
  # asserting byte-identity of W3 protected tables across up→down.
  auth-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true, cache-dependency-glob: "uv.lock" }
      - name: Sync (frozen lock)
        run: uv sync --frozen --dev
      - name: Generate ephemeral auth secrets
        run: |
          {
            echo "SHIELD_AUTH_MODE=enterprise"
            echo "SHIELD_SESSION_SECRETS=ci:$(uv run python infra/secrets/gen.py session)"
            echo "SHIELD_PASSWORD_PEPPERS=ci:$(uv run python infra/secrets/gen.py pepper)"
            echo "SHIELD_AUTH_FERNET_KEYS=ci:$(uv run python infra/secrets/gen.py fernet)"
            echo "SHIELD_EMAIL_BACKEND=smtp"
            echo "SMTP_HOST=localhost"
            echo "SMTP_PORT=1025"
            echo "MAILHOG_HOST=localhost"
            echo "MAILHOG_API_PORT=8025"
            # The docker-compose postgres:16 image we run in CI has no SSL
            # listener; asyncpg's default SSL=prefer on a plain DSN trips
            # `connection_lost` during the handshake (RC#2). Set sslmode=
            # disable explicitly + PGSSLMODE belt-and-braces. migrate.py
            # also honours this internally (ssl=False default on plain DSN;
            # sslmode=disable in DSN respected; sslmode=require flips on).
            echo "DATABASE_URL=postgresql://shield:shield@localhost:5432/shield?sslmode=disable"
            echo "PGSSLMODE=disable"
          } >> "$GITHUB_ENV"
      - name: Bring up infra (incl. Mailhog)
        run: docker compose -f infra/docker-compose.yml up -d postgres redis minio chromadb mailhog
      - name: Wait for health (includes Mailhog under SHIELD_AUTH_MODE=enterprise)
        run: uv run python infra/wait_for_health.py
      - name: Migrate
        run: uv run python -m shield_server.migrate
      - name: Auth integration suite + migration fire-drill (ADR-0013 §A5)
        run: uv run pytest tests/integration/auth -m integration_auth
      - if: always()
        run: docker compose -f infra/docker-compose.yml logs > compose-auth.log
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: auth-integration-logs, path: compose-auth.log }
